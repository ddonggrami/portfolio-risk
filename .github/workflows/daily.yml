name: risk-check

on:
  schedule:
    - cron: "7 14-21 * * 1-5"   # 미장 중 매시간 (한국시간 23:07~06:07)
    - cron: "17 23 * * 1-5"     # 장 마감 후 확정 점검 (한국시간 08:17, 화~토)
    - cron: "13 0 * * 0"        # 주간 요약 (한국시간 일요일 09:13)
  workflow_dispatch:
    inputs:
      reason:
        description: "manual = 지금 점검 결과, weekly = 주간 리포트, deploy = 앱만 갱신(알림 없음), hourly/daily = 외부 스케줄러가 보내는 정기 점검"
        required: false
        default: "manual"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: risk-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run kind
        id: kind
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*) case "${{ github.event.inputs.reason }}" in weekly) echo "kind=weekly" >> "$GITHUB_OUTPUT" ;; deploy) echo "kind=deploy" >> "$GITHUB_OUTPUT" ;; hourly) echo "kind=hourly" >> "$GITHUB_OUTPUT" ;; daily) echo "kind=daily" >> "$GITHUB_OUTPUT" ;; *) echo "kind=manual" >> "$GITHUB_OUTPUT" ;; esac ;;
            "schedule:13 0 * * 0") echo "kind=weekly" >> "$GITHUB_OUTPUT" ;;
            "schedule:17 23 * * 1-5") echo "kind=daily" >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=hourly" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Install
        run: pip install -r requirements.txt

      - name: Self-test
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Holdings tickers (encrypted → ticker list only)
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        run: node scripts/extra_tickers.mjs

      - name: Build market data + app
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python run.py --out site

      - name: Engine check (JS vs Python)
        run: |
          node tests/engine_run.js site engine_out.json
          python tests/compare_engine.py site engine_out.json > /dev/null

      - name: Previous alert state
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://${OWNER}.github.io/${{ github.event.repository.name }}/alert_state.enc.json?t=$(date +%s)" -o prev_state.json || echo "이전 상태 없음"

      - name: Alerts
        env:
          RUN_KIND: ${{ steps.kind.outputs.kind }}
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/alerts.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
