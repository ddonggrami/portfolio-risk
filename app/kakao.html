<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카톡 알림 연결</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--accent:#2a78d6;--good:#0ca30c;--crit:#d03b3b;--row:#f5f5f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--accent:#3987e5;--row:#222221}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--accent:#3987e5;--row:#222221}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:#1c5cab;color:#fff;padding:14px 16px;font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 6px}
p,li{color:var(--ink2);font-size:14px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--grid);border-radius:8px;background:var(--card);color:var(--ink);margin:4px 0 10px}
button,.btn{display:inline-block;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
button.sec{background:var(--row);color:var(--ink);border:1px solid var(--grid)}
code,.tok{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--row);padding:2px 5px;border-radius:4px;word-break:break-all}
.tok{display:block;padding:10px;margin:6px 0}
.ok{color:var(--good);font-weight:600}.err{color:var(--crit);font-weight:600}
ol{padding-left:20px}
</style>
</head>
<body>
<header>카톡 알림 연결</header>
<main id="main"></main>
<script>
(function () {
  "use strict";
  const $ = s => document.querySelector(s), main = $("#main");
  const ss = { get: k => { try { return sessionStorage.getItem("kk." + k) || ""; } catch (e) { return ""; } }, set: (k, v) => { try { sessionStorage.setItem("kk." + k, v); } catch (e) { } } };
  const redirect = location.origin + location.pathname;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const KOE = { KOE006: "카카오 개발자 사이트에 등록한 Redirect URI가 이 페이지 주소와 다릅니다.", KOE101: "REST API 키가 틀렸습니다.", KOE010: "클라이언트 시크릿이 켜져 있는데 입력하지 않았거나 틀렸습니다.", KOE320: "인증 코드가 만료됐습니다. 처음부터 다시 해주세요.", KOE205: "동의항목 '카카오톡 메시지 전송'이 설정되지 않았습니다." };

  function start() {
    main.innerHTML = `<div class="card"><h2>1. 카카오 앱 정보 입력</h2>
      <p>카카오 개발자 사이트의 내 앱에서 <b>REST API 키</b>를 복사해 붙여넣으세요. 클라이언트 시크릿을 켜지 않았다면 두 번째 칸은 비워두세요.</p>
      <label>REST API 키<input id="key" autocomplete="off" value="${esc(ss.get("key"))}"></label>
      <label>클라이언트 시크릿 (선택)<input id="sec" autocomplete="off" value="${esc(ss.get("sec"))}"></label>
      <p>이 페이지 주소(Redirect URI로 등록할 값):<span class="tok">${esc(redirect)}</span></p>
      <button id="go">카카오 로그인하고 메시지 권한 동의</button></div>`;
    $("#go").onclick = () => {
      const key = $("#key").value.trim(); if (!key) { alert("REST API 키를 입력하세요"); return; }
      ss.set("key", key); ss.set("sec", $("#sec").value.trim());
      location.href = `https://kauth.kakao.com/oauth/authorize?client_id=${encodeURIComponent(key)}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&scope=talk_message`;
    };
  }

  async function finish(code) {
    main.innerHTML = `<div class="card"><h2>연결 중…</h2><p>토큰을 받는 중입니다.</p></div>`;
    const key = ss.get("key"), sec = ss.get("sec");
    if (!key) { main.innerHTML = `<div class="card"><p class="err">REST API 키 정보가 없습니다. 같은 브라우저에서 처음부터 다시 해주세요.</p><a class="btn" href="${esc(redirect)}">처음으로</a></div>`; return; }
    const body = new URLSearchParams({ grant_type: "authorization_code", client_id: key, redirect_uri: redirect, code });
    if (sec) body.set("client_secret", sec);
    let tok;
    try {
      const r = await fetch("https://kauth.kakao.com/oauth/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded;charset=utf-8" }, body });
      tok = await r.json();
      if (!r.ok || !tok.refresh_token) throw new Error((KOE[tok.error_code] || "") + ` (${tok.error_code || r.status} ${tok.error_description || ""})`);
    } catch (e) { main.innerHTML = `<div class="card"><h2 class="err">연결 실패</h2><p>${esc(e.message)}</p><a class="btn" href="${esc(redirect)}">다시 하기</a></div>`; return; }
    history.replaceState(null, "", redirect);
    let test = "";
    try {
      const appUrl = location.origin + location.pathname.replace(/kakao\.html$/, "");
      const r2 = await fetch("https://kapi.kakao.com/v2/api/talk/memo/default/send", { method: "POST", headers: { Authorization: "Bearer " + tok.access_token, "Content-Type": "application/x-www-form-urlencoded;charset=utf-8" },
        body: new URLSearchParams({ template_object: JSON.stringify({ object_type: "text", text: "✅ 리스크 알림 연결 성공!\n앞으로 이 '나와의 채팅'으로 알림이 옵니다.", link: { web_url: appUrl, mobile_web_url: appUrl }, button_title: "앱에서 보기" }) }) });
      const j = await r2.json();
      test = r2.ok && j.result_code === 0 ? `<p class="ok">✓ 테스트 메시지를 보냈습니다. 카톡 '나와의 채팅'을 확인하세요.</p>` : `<p class="err">테스트 메시지 실패: ${esc(j.msg || r2.status)}. 동의항목 '카카오톡 메시지 전송'을 확인하세요.</p>`;
    } catch (e) { test = `<p>테스트 메시지는 서버에서 첫 알림 때 확인됩니다.</p>`; }
    const days = Math.round((tok.refresh_token_expires_in || 0) / 86400);
    main.innerHTML = `<div class="card"><h2 class="ok">카카오 연결 성공</h2>${test}</div>
      <div class="card"><h2>2. GitHub에 등록할 값</h2>
      <p>아래 값을 <b>복사</b>해서 GitHub 저장소의 <b>Settings → Secrets and variables → Actions → New repository secret</b>에 하나씩 등록하세요. 이름은 정확히 똑같이 써야 합니다.</p>
      <p><b>이름:</b> <code>KAKAO_REST_KEY</code><span class="tok" id="v1">${esc(key)}</span><button class="sec" data-c="v1">복사</button></p>
      <p><b>이름:</b> <code>KAKAO_REFRESH_TOKEN</code><span class="tok" id="v2">${esc(tok.refresh_token)}</span><button class="sec" data-c="v2">복사</button></p>
      ${sec ? `<p><b>이름:</b> <code>KAKAO_CLIENT_SECRET</code><span class="tok" id="v3">${esc(sec)}</span><button class="sec" data-c="v3">복사</button></p>` : ""}
      <p>이 토큰은 ${days || 60}일 동안 유효하고, 서버가 알림을 보낼 때마다 자동으로 새 토큰으로 바꿔 보관합니다(비밀번호 <code>PORTFOLIO_PASSWORD</code>가 등록돼 있어야 보관됩니다).</p>
      <p>등록이 끝나면 이 페이지를 닫아도 됩니다. 토큰은 이 페이지에 저장되지 않습니다.</p></div>`;
    main.querySelectorAll("[data-c]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText($("#" + b.dataset.c).textContent); b.textContent = "복사됨"; } catch (e) { b.textContent = "길게 눌러 복사"; } });
    try { sessionStorage.removeItem("kk.sec"); } catch (e) { }
  }

  const q = new URLSearchParams(location.search);
  if (q.get("code")) finish(q.get("code"));
  else if (q.get("error")) main.innerHTML = `<div class="card"><h2 class="err">동의가 취소됐거나 오류가 났습니다</h2><p>${esc(q.get("error_description") || q.get("error"))}</p><a class="btn" href="${esc(redirect)}">다시 하기</a></div>`;
  else start();
})();
</script>
</body>
</html>
